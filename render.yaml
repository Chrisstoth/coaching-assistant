services:
  - type: web
    name: coaching-assistant-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ANTHROPIC_PRIMARY_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_FAST_MODEL
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_EFFORT
        value: medium
      - key: ANTHROPIC_PLANNING_EFFORT
        value: high
      - key: AI_MAX_HISTORY
        value: "20"
      - key: AI_SUMMARY_BATCH_SIZE
        value: "8"
      - key: AI_SUMMARY_CHAR_LIMIT
        value: "3500"
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
